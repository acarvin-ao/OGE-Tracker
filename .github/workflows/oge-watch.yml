name: OGE watch

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: oge-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OCR and PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr
          pip install --quiet pdfplumber==0.11.4 pytesseract==0.3.13

      - name: Check OGE for new filings
        env:
          NOTIFY_URL: ${{ secrets.NOTIFY_URL }}
        run: python oge_watch.py --notify-url "$NOTIFY_URL"

      - name: Parse transaction reports
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: python parse_278t.py

      - name: Commit any changes
        run: |
          git config user.name "oge-watch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add oge_data docs
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "OGE filings update $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
